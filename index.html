<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pocket Disc Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@1,600;1,700&family=Familjen+Grotesk:wght@400;500;600&family=Share+Tech+Mono&family=Gochi+Hand&display=swap">
<style>
/* Layout: a walnut desk at night under a lamp; objects placed on a scene that rearranges for wide or tall screens */
:root{
  --desk:#2a190d; --desk-hi:#3b2414; --lamp:rgba(255,186,112,.24); --ink:#efe5d6; --ink-2:#b4a48e; --drop:rgba(10,5,2,.62);
  --note:#f1cf55; --pen:#2b2f7a;
  --f-display:"Archivo Narrow","Arial Narrow",sans-serif;
  --f-body:"Familjen Grotesk",system-ui,sans-serif;
  --f-lcd:"Share Tech Mono",ui-monospace,monospace;
  --f-hand:"Gochi Hand","Comic Sans MS",cursive;
  --plastic-hi:#69717b; --plastic:#454c55; --plastic-lo:#2c3137; --edge:#1b1e22;
  color-scheme:dark;
}
body{color:var(--ink);font-family:var(--f-body);min-height:100vh;overflow-x:hidden;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  background-color:var(--desk);
  background-image:
    radial-gradient(70% 55% at 28% 14%,var(--lamp),transparent 72%),
    radial-gradient(130% 110% at 45% 35%,transparent 45%,rgba(0,0,0,.6)),
    url("wood.jpg");
  background-size:auto,auto,900px 900px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{position:relative;margin:0 auto}
.scene{position:absolute;left:0;top:0;transform-origin:0 0}
.obj{position:absolute;left:0;top:0}
.hp{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.batt{display:flex;flex-direction:column;gap:10px}
.aa{position:relative;width:150px;height:32px;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 35%,rgba(0,0,0,.35) 75%,rgba(255,255,255,.12)),linear-gradient(90deg,#1c1c1e 0 64%,#b4692c 64%);box-shadow:4px 8px 8px -3px rgba(0,0,0,.6);font:600 10px/32px var(--f-body);letter-spacing:.14em;color:#d9d6d0;padding-left:14px;box-sizing:border-box}
.aa::after{content:"";position:absolute;right:-6px;top:10px;width:7px;height:12px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#e2e4e7,#8b9096)}
.aa::before{content:"";position:absolute;left:-2px;top:3px;width:3px;height:26px;border-radius:2px;background:#9aa0a6}
#motes{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;z-index:20}

/* ---------- player ---------- */
.player{position:relative;width:440px;height:556px;perspective:2400px;perspective-origin:220px 216px}
.edge,.body{position:absolute;left:0;width:440px;height:520px;border-radius:220px 220px 200px 200px/210px 210px 180px 180px}
.band{position:absolute;left:0;top:0;width:440px;height:520px;border-radius:220px 220px 200px 200px/210px 210px 180px 180px;background:linear-gradient(180deg,#3b414a,#2e3339);box-shadow:inset 0 -10px 24px rgba(0,0,0,.35);-webkit-mask:radial-gradient(circle at 220px 216px,transparent 199px,#000 200px);mask:radial-gradient(circle at 220px 216px,transparent 199px,#000 200px)}
.bandline{position:absolute;left:20px;top:16px;width:400px;height:400px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.08);pointer-events:none}
.edge{top:24px;background:linear-gradient(180deg,#2a2f35,var(--edge) 60%);box-shadow:0 30px 40px -12px var(--drop),0 8px 12px -4px var(--drop)}
.body{top:0;background:radial-gradient(90% 70% at 38% 22%,var(--plastic-hi),var(--plastic) 48%,var(--plastic-lo));box-shadow:inset 0 2px 1px rgba(255,255,255,.18),inset 0 -14px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.35)}
.body::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-radial-gradient(circle at 30% 30%,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.seam{position:absolute;left:29px;top:25px;width:382px;height:382px;border-radius:50%;box-shadow:0 0 0 2px #15181b,0 1px 0 3px rgba(255,255,255,.07)}
.bay{position:absolute;left:35px;top:31px;width:370px;height:370px;border-radius:50%;background:radial-gradient(circle,#24282d 0 14%,#0f1113 15% 60%,#1a1d21 100%);box-shadow:inset 0 6px 18px rgba(0,0,0,.8)}
.bay::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9aa0a6,#3a3f45);box-shadow:0 0 0 5px #1b1e22}
.disc{position:absolute;left:50px;top:46px;width:340px;height:340px;border-radius:50%;transition:transform .22s ease,opacity .22s ease}
.disc.lift{transform:scale(1.14) translateY(-30px);opacity:0}
.disc.drop{transform:scale(.92);opacity:0;transition:none}
.disc svg{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.6)}

.lid{position:absolute;left:35px;top:31px;width:370px;height:370px;border-radius:50%;cursor:default;transform-origin:50% 2%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.25,.45,1);z-index:3}
/* the lid is a 12px slab: stacked rings behind the face make its outer wall and the window's inner wall show once it tilts */
.lid .rim{position:absolute;inset:0;border-radius:50%;pointer-events:none;transform:translateZ(calc(var(--z)*-1px));background:linear-gradient(100deg,#59606a,#353a41 45%,#1f2327);filter:brightness(calc(1.25 - var(--z)*.05));-webkit-mask:radial-gradient(circle at 50% 50%,transparent 109px,#000 110px);mask:radial-gradient(circle at 50% 50%,transparent 109px,#000 110px)}
/* stands in for a brightness filter, which would flatten the slab */
.lid .rim:first-child{filter:brightness(1.7)}
/* opened past upright, the face turns away and the underside shows: darker molded plastic, a stiffening rib, the clear window pane and its tongue seen from behind */
.lid::before,.lid .print,.lid .under{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lid .under{position:absolute;inset:0;border-radius:50%;transform:translateZ(-12px) rotateX(180deg);background:radial-gradient(80% 80% at 45% 40%,#3a4048,#262a30 60%,#1a1d21);box-shadow:inset 0 0 0 2px #2f343a,inset 0 0 0 26px rgba(0,0,0,0),inset 0 0 0 27px rgba(0,0,0,.35),inset 0 0 0 28px rgba(255,255,255,.07);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 109px,#000 110px);mask:radial-gradient(circle at 50% 50%,transparent 109px,#000 110px)}
.lid .under::after{content:"";position:absolute;inset:0;border-radius:50%;background:#000;opacity:.12;transition:opacity .2s}
.player.open .lid:hover .under::after{opacity:0}
.lid::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(85% 85% at 40% 25%,#646c76,#474e57 50%,#353a41);box-shadow:inset 0 2px 1px rgba(255,255,255,.16),inset 0 -6px 14px rgba(0,0,0,.3);-webkit-mask:radial-gradient(circle at 50% 56%,transparent 101px,#000 102px);mask:radial-gradient(circle at 50% 56%,transparent 101px,#000 102px)}
.lid::before{-webkit-mask:radial-gradient(circle at 50% 50%,transparent 109px,#000 110px);mask:radial-gradient(circle at 50% 50%,transparent 109px,#000 110px)}
.tongue{position:absolute;left:-12px;top:66px;width:164px;height:88px;border-radius:0 44px 44px 0;background:linear-gradient(180deg,#535a63,#40464e 55%,#383d44);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset -1px 0 0 rgba(255,255,255,.08),8px 7px 14px -4px rgba(0,0,0,.75);z-index:2}
.tongue::after{content:"";position:absolute;right:28px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4c535b,#2f343a);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.1)}
.tongue svg{position:absolute;left:48px;top:50%;height:27.2px;margin-top:-13.6px;fill:#d5d9dd;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.4))}
.glass{position:absolute;left:75px;top:75px;width:220px;height:220px;border-radius:50%;background:rgba(14,16,20,.5);box-shadow:inset 0 0 0 3px #2a2f35,inset 0 0 0 4px rgba(255,255,255,.12),inset 0 10px 22px rgba(0,0,0,.55);overflow:hidden}
.glass::before{content:"";position:absolute;width:76px;height:320px;left:112px;top:-50px;transform:rotate(32deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.16) 40%,rgba(255,255,255,.05) 70%,transparent)}
.glass::after{content:"";position:absolute;width:14px;height:320px;left:200px;top:-50px;transform:rotate(32deg);background:rgba(255,255,255,.07)}
.print{position:absolute;left:0;right:0;text-align:center;color:#d5d9dd;pointer-events:none}
.print.model{top:24px}
.print.model svg{display:block;margin:0 auto;height:14px;fill:currentColor;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.4))}
.print.sub{top:52px;font:600 9px/1 var(--f-body);letter-spacing:.22em;color:#aab1b8}
.print.dz{top:318px;left:50%;right:auto;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:3px;font:600 9px/1 var(--f-body);letter-spacing:.3em;color:#9aa1a8;text-decoration:none;white-space:nowrap;pointer-events:auto;cursor:pointer}
.print.dz svg{display:block;height:12px;width:auto}
.print.dz svg path{fill:currentColor}
.print.dz:focus-visible{outline:2px solid #8fb4d9;outline-offset:2px}
.player.open .lid{transform:rotateX(96deg);transition-timing-function:cubic-bezier(.3,1.08,.45,1);cursor:pointer}

.latch{position:absolute;right:6px;top:126px;z-index:4;width:30px;height:84px;border:0;padding:0;border-radius:10px;background:linear-gradient(90deg,#2b3036,#3f454d);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;justify-content:center}
.latch span{writing-mode:vertical-rl;font:600 9px/1 var(--f-body);letter-spacing:.25em;color:#c9ced3}
.latch:active{transform:translateY(4px)}

.panel{position:absolute;inset:0;pointer-events:none}
.panel>*{position:absolute;pointer-events:auto}
.panel .rocker{left:34px;top:398px;transform:rotate(38deg)}
.panel .eject{left:386px;top:347px;width:34px;height:34px;border-radius:50%}
.panel .eject svg{width:13px;height:13px}
.panel .ring{left:310px;top:390px;width:80px;height:80px;border-radius:50%;background:#15181b;box-shadow:0 1px 0 rgba(255,255,255,.08),inset 0 2px 4px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.panel .lcdwrap{left:154px;top:432px}
.btn{border:0;padding:0;cursor:pointer;color:#cdd2d7;display:flex;align-items:center;justify-content:center;font-size:12px;background:radial-gradient(circle at 40% 30%,#3c424a,#23272c);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #121417,0 4px 6px rgba(0,0,0,.45);transition:transform .06s,box-shadow .06s}
.btn:active,.btn.pressed{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 #121417,0 1px 2px rgba(0,0,0,.4)}
.btn:focus-visible,.latch:focus-visible{outline:2px solid #8fb4d9;outline-offset:3px}
.rocker{display:flex;border-radius:22px;background:#15181b;padding:3px;gap:3px;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.rocker .btn{width:52px;height:38px}
.rocker .btn:first-child{border-radius:19px 6px 6px 19px}
.rocker .btn:last-child{border-radius:6px 19px 19px 6px}
.play{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#566069,#2c3238)}
.btn svg{width:16px;height:16px;fill:currentColor}
.lcdwrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.lcd{position:relative;width:132px;height:44px;border-radius:5px;background:linear-gradient(180deg,#8f9a83,#a6b098);box-shadow:inset 0 2px 5px rgba(0,0,0,.5),0 0 0 3px #15181b,0 1px 0 4px rgba(255,255,255,.07);font:24px/44px var(--f-lcd);color:#20281b;letter-spacing:.06em;padding:0 10px;box-sizing:border-box;display:flex;justify-content:space-between}
.lcd .ghost{position:absolute;inset:0 10px;display:flex;justify-content:space-between;color:rgba(32,40,27,.09)}
.lcd .live{position:relative;display:flex;justify-content:space-between;width:100%}
.lcd.blink .t{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lcdlab{display:flex;justify-content:space-between;width:120px;font:600 8px/1 var(--f-body);letter-spacing:.18em;color:#9aa1a8}
.shake{animation:shake .28s}
@keyframes shake{25%{translate:5px}50%{translate:-5px}75%{translate:3px}}

/* ---------- jewel case ---------- */
.caseblock{display:flex;flex-direction:column;align-items:center;gap:18px}
.case{position:relative;width:394px;height:354px;perspective:2200px;perspective-origin:0 50%;cursor:pointer;outline:none}
.case:focus-visible{outline:2px solid #8fb4d9;outline-offset:6px}
.recess{position:absolute;left:45px;top:5px;width:344px;height:344px;border-radius:50%;background:radial-gradient(circle,#101214 60%,#181b1f);box-shadow:inset 0 3px 8px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05)}
.hubbase{position:absolute;left:167px;top:127px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#0c0d0f 0 30%,#26292d 31% 44%,#141618 45% 66%,#2a2d31 67% 70%,#131518 71%);box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.hub{position:absolute;left:187px;top:147px;width:60px;height:60px;pointer-events:none}
.hub svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.tdisc{position:absolute;left:52px;top:12px;width:330px;height:330px;border-radius:50%;opacity:0;transition:transform .2s ease,opacity .2s ease}
.tdisc.in{opacity:1}
.tdisc.in.lift{transform:scale(1.1) translate(-40px,-20px);opacity:0}
.tdisc svg{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.lidc{position:absolute;z-index:2;left:40px;top:0;width:354px;height:354px;transform-origin:-40px 50%;transform-style:preserve-3d;transition:transform .3s cubic-bezier(.4,.1,.2,1)}
.case.open .lidc{transform:rotateY(-97deg)}
.face{position:absolute;inset:0;border-radius:0 3px 3px 0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* the lid is a shallow acrylic tray: booklet against the front wall, held by four tabs, walls 12px deep */
.face.back{transform:translateZ(-5px) rotateY(180deg);border-radius:3px 0 0 3px;background:rgba(214,226,238,.14)}
.face.back::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(62deg,transparent 30%,rgba(255,255,255,.14) 42%,transparent 52%),linear-gradient(90deg,rgba(0,0,0,.08),rgba(0,0,0,.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
/* a booklet seen from its back page: fold on the hinge side, the pages beneath creeping out along the open edge */
.booklet{position:absolute;inset:5px 5px 6px 10px;border-radius:1px 4px 4px 1px;background:#ededeb;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),-1px 0 0 #bdb9af,-2px 1px 0 #f3f1ea,-3px 1px 0 #b8b4aa,-4px 2px 0 #eeece4,-5px 2px 0 #b3afa5,-6px 3px 0 #e8e5dc,-7px 3px 0 #aeaa9f,-7px 4px 0 rgba(0,0,0,.35),-4px 6px 8px rgba(0,0,0,.45)}
.booklet::after{content:"";position:absolute;z-index:1;pointer-events:none}
.booklet::after{inset:0;border-radius:inherit;background:linear-gradient(270deg,rgba(0,0,0,.5),rgba(0,0,0,.18) 1.5px,rgba(255,255,255,.4) 4px,rgba(255,255,255,.12) 8px,rgba(0,0,0,.2) 13px,rgba(0,0,0,.06) 18px,transparent 28px),linear-gradient(90deg,rgba(255,255,255,.25),transparent 3px,rgba(0,0,0,.08) 5px,transparent 14px),radial-gradient(130% 100% at 35% 45%,transparent 55%,rgba(0,0,0,.14))}
/* clear hooked clips molded into the top and bottom walls, one near the outer edge and one near the hinge, pinching the booklet */
.tab{position:absolute;z-index:3;width:24px;height:12px;background:radial-gradient(60% 90% at 50% 0,rgba(255,255,255,.55),rgba(222,234,246,.22) 70%);border:1px solid rgba(255,255,255,.85);border-top:0;border-radius:0 0 12px 12px/0 0 11px 11px;box-shadow:0 2px 2px -1px rgba(0,0,0,.45),inset 0 -2px 2px rgba(255,255,255,.35)}
.tab::after{content:"";position:absolute;left:6px;right:6px;top:1px;height:5px;border:1px solid rgba(255,255,255,.75);border-top:0;border-radius:0 0 6px 6px;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.tab.t{top:0}.tab.b{bottom:0;transform:scaleY(-1)}
.tab.o{left:17%}.tab.h{right:8%}
.face.lip{transform:translateZ(-12px) rotateY(180deg);border-radius:3px 0 0 3px;border:solid rgba(236,244,252,.32);border-width:3px 0 3px 3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.2);pointer-events:none}
/* the lid pivots on the spine's outer edge; this clear strip spans the spine, so opening lifts it off and bares the spine */
.bridge{position:absolute;left:-40px;top:0;width:40px;height:100%;border-radius:3px 0 0 3px;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(214,226,238,.05) 40%,rgba(255,255,255,.1));box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.ls{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none;background:linear-gradient(var(--d),rgba(255,255,255,.65) 0 1px,#eeebe3 1px 2px,#bcb8ae 2px 2.5px,#eeebe3 2.5px 3.5px,#bcb8ae 3.5px 4px,#e6e3da 4px 5.5px,rgba(0,0,0,.3) 5.5px 6px,rgba(214,228,242,.2) 6px calc(100% - 1.5px),rgba(255,255,255,.7) calc(100% - 1.5px))}
.ls.r{--d:90deg;left:100%;top:0;width:12px;height:100%;transform-origin:0 50%;transform:rotateY(90deg)}
.ls.t{--d:0deg;left:0;bottom:100%;width:100%;height:12px;transform-origin:50% 100%;transform:rotateX(90deg)}
.ls.b{--d:180deg;left:0;top:100%;width:100%;height:12px;transform-origin:50% 0;transform:rotateX(-90deg)}
@media (prefers-reduced-motion: reduce){.lidc,.tdisc{transition:none}}
.case .tray{position:absolute;inset:0;border-radius:3px;background:radial-gradient(70% 70% at 55% 45%,#23272c,#131518);box-shadow:0 22px 30px -10px var(--drop),0 4px 8px -2px var(--drop)}
.inlay{position:absolute;left:0;top:0;width:394px;height:354px;border-radius:3px;background:center/cover no-repeat}
/* with tray art the molding is clear plastic over it */
/* with tray art the molding is clear plastic over it: a bevelled disc well, a raised ring with clear teeth, gloss on top */
.tray.clear .recess{background:radial-gradient(circle closest-side,transparent 94%,rgba(0,0,0,.14) 98.5%,rgba(255,255,255,.18) 100%);box-shadow:0 0 0 1px rgba(255,255,255,.32),0 1px 0 2px rgba(0,0,0,.14),inset 0 0 0 1px rgba(0,0,0,.2),inset 0 3px 4px -2px rgba(0,0,0,.3)}
.tray.clear .hubbase{left:153px;top:113px;width:128px;height:128px;background:radial-gradient(circle closest-side,transparent 0 50%,rgba(255,255,255,.4) 51% 52.5%,rgba(0,0,0,.18) 53.5% 56%,rgba(255,255,255,.07) 57% 84%,rgba(0,0,0,.16) 85% 87%,rgba(255,255,255,.45) 88% 90%,rgba(0,0,0,.1) 92%,transparent 97%);box-shadow:none}
.case .glass{display:none;position:absolute;left:40px;top:0;width:354px;height:354px;border-radius:0 3px 3px 0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.16) 0 7%,rgba(255,255,255,.05) 18%,transparent 34%,transparent 64%,rgba(255,255,255,.07) 71%,transparent 79%),linear-gradient(rgba(214,226,238,.05),rgba(214,226,238,.05));box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 0 0 4px rgba(255,255,255,.05),inset 0 0 0 5px rgba(0,0,0,.18),inset 6px 0 8px -4px rgba(0,0,0,.45)}
.tray.clear .glass{display:block}
.tray.clear .hub .ht{fill:rgba(236,243,250,.3);stroke:rgba(255,255,255,.6)}
.tray.clear .hub .hc{fill:rgba(236,243,250,.35);stroke:rgba(255,255,255,.6)}
.tray.clear .hub .hr{stroke:rgba(255,255,255,.35);stroke-width:1}
.tray.clear .hub svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.case .cover{position:absolute;left:3px;top:3px;width:348px;height:348px}
/* the booklet's folded spine, seen through the lid along the hinge */
.case .cover::after{content:"";position:absolute;z-index:1;pointer-events:none}
.case .cover::after{inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.15) 1.5px,rgba(255,255,255,.35) 4px,rgba(255,255,255,.1) 8px,rgba(0,0,0,.18) 12px,transparent 24px)}

  <path d="M-30.5 -8.2H-22.5Q-19 -8.2 -18.6 -5" fill="none" stroke="rgba(255,240,220,.3)" stroke-width="1.1" stroke-linecap="round"/></g></g>`;
}
let hpKey='';
function drawHP(key,c){
 if(hpKey==key)return;hpKey=key;
 const h=c.hp,j=[c.player[0],c.player[1]+300];
 const plugEnd=add(j,PLUG_OUT);
 const A=budSVG(h.A,'hpa',false),B=budSVG(h.B,'hpb',true);
 // the cord runs into either end of the volume remote
 const rd=[Math.cos(h.rem[2]*Math.PI/180),Math.sin(h.rem[2]*Math.PI/180)],rIn=add(h.rem,rd,-50),rOut=add(h.rem,rd,50);
 const md=unit(sub(h.split,rOut));
 const main=spline([plugEnd,...h.cord,rIn],[0,1],rd)+spline([rOut,h.split],rd,md);
 const bA=spline([h.split,...h.A.via,h.A.end],md,h.A.dir.map(v=>-v));
 const bB=spline([h.split,...h.B.via,h.B.end],md,h.B.dir.map(v=>-v));
 const ang=Math.atan2(md[1],md[0])*180/Math.PI;
 $('hp').setAttribute('width',c.w);$('hp').setAttribute('height',c.h);
 $('hp').innerHTML=`<defs>
  <filter id="hpSh" x="-10%" y="-10%" width="130%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="1" result="a"/><feOffset dx="1.2" dy="2" result="a"/><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feOffset in="b" dx="4" dy="7" result="b"/><feComponentTransfer in="b" result="b"><feFuncA type="linear" slope=".5"/></feComponentTransfer><feComponentTransfer in="a" result="a"><feFuncA type="linear" slope=".7"/></feComponentTransfer><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="hpShB" x="-60%" y="-150%" width="260%" height="400%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="a"/><feOffset dx="2" dy="3" result="a"/><feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/><feOffset in="b" dx="7" dy="12" result="b"/><feComponentTransfer in="b" result="b"><feFuncA type="linear" slope=".55"/></feComponentTransfer><feComponentTransfer in="a" result="a"><feFuncA type="linear" slope=".75"/></feComponentTransfer><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="hpBlur"><feGaussianBlur stdDeviation="1.6"/></filter>
  <linearGradient id="hpTube" x1="0" x2="1"><stop offset="0" stop-color="#050506"/><stop offset=".3" stop-color="#3d3f44"/><stop offset=".55" stop-color="#141518"/><stop offset="1" stop-color="#000"/></linearGradient>
  <linearGradient id="hpTubeV" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#202124"/><stop offset=".22" stop-color="#46484d"/><stop offset=".5" stop-color="#141518"/><stop offset="1" stop-color="#000"/></linearGradient>
  <linearGradient id="hpChrome" x1="0" x2="1"><stop offset="0" stop-color="#55595f"/><stop offset=".25" stop-color="#f4f1ec"/><stop offset=".45" stop-color="#a7acb1"/><stop offset=".7" stop-color="#dfe2e5"/><stop offset="1" stop-color="#3f4348"/></linearGradient>
  <linearGradient id="hpChromeV" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8e9399"/><stop offset=".25" stop-color="#fbf8f3"/><stop offset=".5" stop-color="#a3a8ad"/><stop offset=".75" stop-color="#d5d8db"/><stop offset="1" stop-color="#3b3f44"/></linearGradient>
  <linearGradient id="hpGold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8a6420"/><stop offset=".3" stop-color="#f6dc8e"/><stop offset=".6" stop-color="#b8892e"/><stop offset="1" stop-color="#5e4212"/></linearGradient>
  <radialGradient id="hpCurve" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></radialGradient>
  <pattern id="hpMesh" width="2.2" height="2.2" patternUnits="userSpaceOnUse"><rect width="2.2" height="2.2" fill="#0c0c0e"/><circle cx="1.1" cy="1.1" r=".6" fill="#34363b"/></pattern>
  ${A.defs}${B.defs}</defs>
  <g filter="url(#hpSh)">${cordSVG(main)}${cordSVG(bA)}${cordSVG(bB)}</g>
  <g filter="url(#hpShB)" transform="translate(${h.split}) rotate(${ang})"><rect x="-9" y="-4.4" width="18" height="8.8" rx="3.6" fill="url(#hpTubeV)"/><rect x="-7" y="-3.2" width="14" height="1.1" rx=".55" fill="rgba(255,240,220,.3)"/></g>
  ${A.svg}${B.svg}${plugSVG(...j)}`;
 const rm=$('remote'),ra=h.rem[2]*Math.PI/180;
 place(rm,h.rem[0]-46,h.rem[1]-15,h.rem[2]);
 // keep the shadow falling down-right on the desk whatever the remote's angle
 rm.style.setProperty('--sx',f1(4*Math.cos(ra)+7*Math.sin(ra))+'px');rm.style.setProperty('--sy',f1(7*Math.cos(ra)-4*Math.sin(ra))+'px');
}
function place(el,x,y,r){el.style.left=x+'px';el.style.top=y+'px';el.style.transform=r?`rotate(${r}deg)`:''}
function layout(){
 const avail=document.documentElement.clientWidth-32,vh=window.innerHeight;
 const wide=avail>=900&&avail/vh>=1.05;
 const c=wide?LAYOUTS.wide:LAYOUTS.tall;
 // desktop: objects span ~85% of the viewport width (80% at 2560+), limited by what fits vertically
 const tw=Math.min(avail,Math.max((innerWidth>=2560?.8:.85)*innerWidth,1.1*c.w));
 const s=wide?Math.min(tw/c.w,Math.max((vh-64)/c.h,.62)):Math.min(1.25,avail/c.w);
 place($('pwrap'),...c.player);place($('cwrap'),...c.cse);drawHP(wide?'wide':'tall',c);
 const sc=$('scene');sc.style.width=c.w+'px';sc.style.height=c.h+'px';sc.style.transform=`scale(${s})`;
 const wr=$('wrap');wr.style.width=c.w*s+'px';wr.style.height=c.h*s+'px';
}
addEventListener('resize',layout);layout();

(()=>{
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const cv=$('motes'),g=cv.getContext('2d');let W,H,dpr;
 function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
 size();addEventListener('resize',size);
 const M=Array.from({length:34},()=>({x:Math.random(),y:Math.random()*.7,r:.6+Math.random()*1.6,vx:(Math.random()-.5)*.00012,vy:-.00004-Math.random()*.00008,p:Math.random()*6.28}));
 (function tick(t){
  g.clearRect(0,0,W,H);
  for(const m of M){
   m.x+=m.vx+Math.sin(t/4000+m.p)*.00006;m.y+=m.vy;if(m.y<-.02){m.y=.7;m.x=Math.random()}
   const dx=m.x-.28,dy=m.y-.14,light=Math.max(0,1-Math.sqrt(dx*dx*1.6+dy*dy*2.2));
   const a=light*(.35+.35*Math.sin(t/900+m.p));if(a<=.01)continue;
   g.fillStyle=`rgba(255,214,160,${a.toFixed(3)})`;g.beginPath();g.arc(m.x*W,m.y*H,m.r,0,6.283);g.fill();
  }
  requestAnimationFrame(tick);
 })(0);
})();
cue(0);level();render();setSt('paused');loop();
// first disc, then its neighbours, then the rest one at a time
load(R[0]).then(()=>{if(i==0&&st!='swapping')render()});
[R[1],R[R.length-1],...R.slice(2,-1)].reduce((q,r)=>q.then(()=>load(r)),load(R[0]));
