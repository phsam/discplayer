<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Record Images</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1c1b19;--mute:#76716a;--line:#e3dfd8;--slot:#ece8e1;--accent:#2f6fde;--ok:#2f8a57;--bad:#c8473f;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161514;--card:#201f1d;--ink:#eeebe6;--mute:#9a958d;--line:#33312e;--slot:#2a2826;--accent:#6c9cf0;--ok:#55b07c;--bad:#e06a62}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;margin-right:auto}
header a{color:var(--accent)}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);width:200px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mute);cursor:pointer}
main{padding:20px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
@media (max-width:520px){main{grid-template-columns:1fr;padding:16px}header{padding:12px 16px}}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.rec h2{font-size:15px;margin:0}
.rec p{margin:2px 0 12px;color:var(--mute);font-size:13px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{display:flex;flex-direction:column;gap:5px;min-width:0}
.box{position:relative;aspect-ratio:1;border-radius:6px;background:var(--slot);overflow:hidden;cursor:pointer;outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .15s}
.box.has{cursor:zoom-in}
.box:hover,.box.over{outline-color:var(--accent)}
.box.over::after{content:'';position:absolute;left:0;bottom:0;z-index:3;width:100%;height:4px;background:var(--accent);transform-origin:left;animation:hold 1.5s linear forwards}
.box.over *{pointer-events:none}
.box.armed{outline-style:solid}
@keyframes hold{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.box.disc img.art{-webkit-mask:radial-gradient(closest-side,transparent var(--hole),#000 calc(var(--hole) + .15%),#000 99.8%,transparent 100%);mask:radial-gradient(closest-side,transparent var(--hole),#000 calc(var(--hole) + .15%),#000 99.8%,transparent 100%)}
.box img.guide{display:none;opacity:.9}
body.guides .box.disc.has img.guide{display:block}
.box .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:12px;padding:6px}
.box .busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 70%,transparent);font-size:12px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:12px}
.meta b{font-weight:600}
.meta .req{color:var(--bad);font-weight:500}
.meta span{display:flex;gap:8px}
.meta button{font:inherit;font-size:12px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.meta button[data-del]{color:var(--bad)}
.note{font-size:11px;color:var(--mute);min-height:1em;overflow-wrap:anywhere}
.note.err{color:var(--bad)}
.note.ok{color:var(--ok)}
.hidden{display:none}
#view{padding:0;border:0;background:none;max-width:none;max-height:none;width:100vw;height:100dvh;cursor:zoom-out}
#view[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#view::backdrop{background:rgba(0,0,0,.9)}
#view .frame{position:relative;width:min(100%,100dvh - 90px);aspect-ratio:1}
#view img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:4px}
/* dims what the disc mask cuts away and rings the edges; the gradient itself is set by drawCrop() */
#view .crop{position:absolute;inset:0;display:none;cursor:move;touch-action:none}
#view.crop-on .crop{display:block}
/* trays show the uncropped source at its own shape, with the box that gets saved; drag it to move, its corners to resize */
#view.sq-on .frame{aspect-ratio:var(--ar);width:min(100%,(100dvh - 90px)*var(--ar));overflow:hidden;border-radius:4px}
#view.sq-on img{border-radius:0}
#view .sq{position:absolute;display:none;cursor:move;touch-action:none;user-select:none;-webkit-user-select:none;outline:1px solid #fff;box-shadow:0 0 0 100vmax rgba(0,0,0,.72)}
#view.sq-on .sq{display:block}
/* resize handles sit just inside the box, so the frame's edge never clips them */
#view .sq i{position:absolute;width:14px;height:14px;transform:translate(var(--tx),var(--ty));background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#view .sq i[data-e*=n]{top:0;--ty:0}#view .sq i[data-e*=s]{top:100%;--ty:-100%}#view .sq i[data-e*=w]{left:0;--tx:0}#view .sq i[data-e*=e]{left:100%;--tx:-100%}
#view .sq i[data-e=nw],#view .sq i[data-e=se]{cursor:nwse-resize}
#view .sq i[data-e=ne],#view .sq i[data-e=sw]{cursor:nesw-resize}
#view .bar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;align-items:center;color:#ddd;font-size:13px;cursor:default}
#view .tools{display:flex;gap:10px;align-items:center}
#view .tools label{display:flex;gap:6px;align-items:center}
#view .tools input{width:100px}
#view .tools[hidden]{display:none}
#view .bar p{margin:0}
#view .bar button{font:inherit;padding:4px 10px;border:1px solid #666;border-radius:6px;background:#222;color:#eee;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Record images</h1>
  <input type="search" id="q" placeholder="Filter records" aria-label="Filter records">
  <label class="chk"><input type="checkbox" id="missing"> Missing only</label>
  <label class="chk"><input type="checkbox" id="guides"> Disc guide</label>
  <a href="/" target="_blank">Open player ↗</a>
</header>
<main id="list"></main>
<input type="file" id="file" accept="image/*" hidden>
<dialog id="view" aria-label="Image preview"><div class="frame"><img alt=""><div class="crop"></div><div class="sq"><i data-e="nw"></i><i data-e="ne"></i><i data-e="se"></i><i data-e="sw"></i></div></div><div class="bar"><p></p><span class="tools" id="sqTools"><button type="button" id="sqReset">Reset</button><button type="button" id="sqSave">Save crop</button></span><span class="tools" id="cropTools"><label>Size <input type="range" id="cropSize" min="30" max="150" step="1"></label><label>Hole <input type="range" id="cropHole" min="10" max="60" step=".25"></label><button type="button" id="cropReset">Reset</button><button type="button" id="cropSave">Save crop</button></span><button type="button" id="crop"></button></div></dialog>

<script>
// Uploads go to records/<slug>-<kind>.jpg via the dev server (scripts/admin.mjs).
// Images are squared, resized and compressed here to match records/IMAGE-SPECS.md: 800×800 JPEG under 200 KB.
// Trays are cropped to the shape of the area the art fills in the player (394×354), 900 px tall.
const SIZE=800,LIMIT=200*1024;
// the default tray crop: the largest centered box of that shape, as edge fractions of a w×h image
const TRAY_AR=394/354;
const trayBox=(w,h)=>{const x=Math.min(1,h*TRAY_AR/w)/2,y=Math.min(1,w/TRAY_AR/h)/2;return {l:.5-x,t:.5-y,r:.5+x,b:.5+y}};
const traySize=(w,h)=>{const z=Math.min(900/Math.min(w,h),2400/Math.max(w,h));return [Math.round(w*z),Math.round(h*z)]};
const HOLE=.2775; // default inner-circle radius as a fraction of the disc's; a record's own is r.hole, kept in index.html
const KINDS=[
 {k:'cover',label:'Cover',hint:'Front of the booklet'},
 {k:'disc',label:'Disc',hint:'Printed disc face'},
 {k:'back',label:'Back',hint:'Inside of the lid'},
 {k:'tray',label:'Tray',hint:'Art behind the tray'}
];
const $=id=>document.getElementById(id);
let RECS=[],pick=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const kb=n=>Math.round(n/1024)+' KB';

async function api(path,opt){
 const r=await fetch('/admin/api/'+path,opt);
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);
 return j;
}

function slotHTML(r,{k,label,hint}){
 const v=r.images[k];
 return `<div class="slot" data-k="${r.k}" data-kind="${k}">
  <div class="box ${k} ${v?'has':''}"${k==='disc'?` style="--hole:${(r.hole||HOLE)*100}%"`:''} tabindex="0" role="button" aria-label="${v?'View':'Upload'} ${label.toLowerCase()} for ${esc(r.t)}">
   ${v?`<img class="art" src="/records/${r.k}-${k}.jpg?v=${v}" alt="">`:`<div class="empty">Drop or click<br>${hint}</div>`}
   ${k==='disc'?'<img class="guide" src="/records/disc-template.svg" alt="">':''}
  </div>
  <div class="meta"><b>${label}</b>${v?`<span><button data-pick>Replace</button>${k==='cover'?'':'<button data-del>Remove</button>'}</span>`:(k==='cover'?'<span class="req">required</span>':'')}</div>
  <div class="note"></div>
 </div>`;
}

function render(){
 const q=$('q').value.trim().toLowerCase(),miss=$('missing').checked;
 $('list').innerHTML=RECS.map((r,i)=>{
  const hide=(q&&!`${r.t} ${r.a} ${r.k}`.toLowerCase().includes(q))||(miss&&KINDS.every(x=>r.images[x.k]));
  return `<section class="rec ${hide?'hidden':''}" id="r-${r.k}">
   <h2>${String(i+1).padStart(2,'0')} · ${esc(r.t)}</h2><p>${esc(r.a)} · ${r.y} · <code>${r.k}</code></p>
   <div class="slots">${KINDS.map(x=>slotHTML(r,x)).join('')}</div></section>`;
 }).join('');
}

// center-crop to a square, scale to 800, then lower JPEG quality until it fits under 200 KB. Trays are cropped
// to trayBox instead (scaled by traySize), and also return that crop and the whole image with its short side at
// most 1800, so the box can be changed later and still be sharp.
async function prepare(file,kind){
 const bmp=await createImageBitmap(file),tray=kind==='tray',notes=[];
 const s=Math.min(bmp.width,bmp.height),box=tray?trayBox(bmp.width,bmp.height):null;
 const [bw,bh]=tray?[(box.r-box.l)*bmp.width,(box.b-box.t)*bmp.height]:[s,s],[W,H]=tray?traySize(bw,bh):[SIZE,SIZE];
 if(bw<bmp.width-2||bh<bmp.height-2)notes.push(`cropped ${bmp.width}×${bmp.height} to ${tray?'the tray shape':'square'}`);
 if(W>bw+1)notes.push(`upscaled from ${Math.round(bw)}×${Math.round(bh)}`);
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const g=c.getContext('2d');
 g.fillStyle='#000';g.fillRect(0,0,W,H);
 g.imageSmoothingQuality='high';
 g.drawImage(bmp,(bmp.width-bw)/2,(bmp.height-bh)/2,bw,bh,0,0,W,H);
 let src=null;
 if(tray){
  const z=Math.min(1,1800/s),o=document.createElement('canvas');
  o.width=Math.round(bmp.width*z);o.height=Math.round(bmp.height*z);
  const og=o.getContext('2d');og.imageSmoothingQuality='high';og.drawImage(bmp,0,0,o.width,o.height);
  src=await new Promise(ok=>o.toBlob(ok,'image/jpeg',.9));
 }
 bmp.close&&bmp.close();
 const blob=await encode(c);
 if(blob.size>LIMIT)notes.push('still over 200 KB');
 return {blob,src,box,notes};
}

async function encode(c){
 let blob;
 for(let q=.86;q>=.4;q-=.06){
  blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));
  if(blob.size<=LIMIT)break;
 }
 return blob;
}

function note(slot,text,cls=''){const n=slot.querySelector('.note');n.textContent=text;n.className='note '+cls}

async function upload(slot,file){
 if(!file||!file.type.startsWith('image/'))return note(slot,'Not an image','err');
 const {k,kind}=slot.dataset,box=slot.querySelector('.box');
 box.insertAdjacentHTML('beforeend','<div class="busy">Saving…</div>');
 try{
  const keep=kind==='tray',{blob,src,box,notes}=await prepare(file,kind);
  if(keep)await api(`source/${k}/${kind}`,{method:'PUT',headers:{'content-type':'image/jpeg'},body:src});
  const res=await api(`image/${k}/${kind}${keep?'?crop='+[box.l,box.t,box.r,box.b].map(v=>v.toFixed(4)).join(','):''}`,{method:'PUT',headers:{'content-type':'image/jpeg'},body:blob});
  const r=RECS.find(r=>r.k===k);r.images=res.images;r.sources=res.sources;render();
  note(document.querySelector(`.slot[data-k="${k}"][data-kind="${kind}"]`),`Saved ${kb(blob.size)}${notes.length?' · '+notes.join(', '):''}`,'ok');
 }catch(e){box.querySelector('.busy')?.remove();note(slot,e.message,'err')}
}

async function remove(slot){
 const {k,kind}=slot.dataset,r=RECS.find(r=>r.k===k);
 if(!confirm(`Remove the ${kind} image for “${r.t}”?`))return;
 try{({images:r.images,sources:r.sources}=await api(`image/${k}/${kind}`,{method:'DELETE'}));render()}
 catch(e){note(slot,e.message,'err')}
}

function choose(slot){pick=slot;$('file').value='';$('file').click()}

// full-screen preview of the saved file (unmasked, so the whole square shows)
// discs get a toggle that shows what the disc mask crops; the choice sticks between opens.
// With the crop showing, drag it to move and scroll/pinch or use the slider to resize; shift+scroll or
// the Hole slider resizes only the inner circle. "Save crop" re-renders the image so that circle becomes
// the disc, and saves the inner circle to the record. crop is the disc's center (fraction of the square),
// its radius as a fraction of the full-size disc, and the inner circle's radius as a fraction of its own.
let showCrop=false,isDisc=false,cur=null,crop={x:.5,y:.5,s:1,h:HOLE};
const rec=()=>RECS.find(r=>r.k===cur.dataset.k);
const saved=()=>({x:.5,y:.5,s:1,h:rec().hole||HOLE});
const frame=$('view').querySelector('.frame'),ring=$('view').querySelector('.crop');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function drawCrop(){
 $('cropSize').value=Math.round(crop.s*100);$('cropHole').value=crop.h*100;
 // same stops as .box.disc img.art: inner circle at crop.h, edge at the full radius, as the player clips a disc image
 const h=crop.h*100;
 ring.style.background=`radial-gradient(circle ${crop.s*frame.clientWidth/2}px at ${crop.x*100}% ${crop.y*100}%,rgba(0,0,0,.72) ${h-.15}%,#fff ${h}%,transparent ${h+.2}%,transparent 99.4%,#fff 99.6%,rgba(0,0,0,.72) 99.8%)`;
}
function cropUI(){
 const on=isDisc&&showCrop;
 $('view').classList.toggle('crop-on',on);
 $('crop').hidden=!isDisc;$('crop').textContent=showCrop?'Hide crop':'Show crop';
 $('cropTools').hidden=!on;
 if(on)drawCrop();
}
function view(slot){
 const r=RECS.find(r=>r.k===slot.dataset.k),kind=KINDS.find(x=>x.k===slot.dataset.kind);
 const d=$('view');
 cur=slot;isDisc=kind.k==='disc';crop=saved();
 src=r.sources?.[kind.k]||null;
 d.classList.remove('sq-on');$('sqTools').hidden=!src;
 if(src){
  img.onload=()=>{img.onload=null;q=start();d.style.setProperty('--ar',img.naturalWidth/img.naturalHeight);d.classList.add('sq-on');drawSq()};
  img.src=`/admin/api/source/${r.k}/${kind.k}?v=${src.v}`;
  if(img.complete&&img.naturalWidth)img.onload(); // same URL as last time fires no load
 }else img.src=slot.querySelector('img.art').src;
 d.querySelector('p').textContent=`${r.t} · ${kind.label}${kind.k==='tray'&&!src?' · replace it to choose the crop':''}`;
 d.showModal();
 cropUI();
}
// a click closes the preview, except on the controls or while editing the crop
$('view').addEventListener('click',e=>{
 if(e.target.closest('.bar')||((isDisc&&showCrop||src)&&e.target.closest('.frame')))return;
 $('view').close();
});
$('crop').addEventListener('click',()=>{showCrop=!showCrop;cropUI()});
addEventListener('resize',()=>{if($('view').open&&isDisc&&showCrop)drawCrop()});

ring.addEventListener('pointerdown',e=>{
 ring.setPointerCapture(e.pointerId);
 const w=frame.clientWidth,x0=e.clientX,y0=e.clientY,{x,y}=crop;
 ring.onpointermove=m=>{crop.x=clamp(x+(m.clientX-x0)/w,0,1);crop.y=clamp(y+(m.clientY-y0)/w,0,1);drawCrop()};
 ring.onpointerup=ring.onpointercancel=()=>ring.onpointermove=null;
});
ring.addEventListener('wheel',e=>{
 e.preventDefault();
 const z=Math.exp(-(e.deltaY||e.deltaX)*.002); // shift+wheel scrolls sideways on some systems
 if(e.shiftKey)crop.h=clamp(crop.h*z,.1,.6);else crop.s=clamp(crop.s*z,.3,1.5);
 drawCrop();
},{passive:false});
$('cropSize').addEventListener('input',e=>{crop.s=e.target.value/100;drawCrop()});
$('cropHole').addEventListener('input',e=>{crop.h=e.target.value/100;drawCrop()});
$('cropReset').addEventListener('click',()=>{crop=saved();drawCrop()});

$('cropSave').addEventListener('click',async e=>{
 const btn=e.target,img=$('view').querySelector('img'),{k,kind}=cur.dataset,r=rec(),done=[];
 btn.disabled=true;btn.textContent='Saving…';
 try{
  if(crop.x!==.5||crop.y!==.5||crop.s!==1){
   // scale and shift so the chosen circle fills the 800 px square; anything off the source is black
   const c=document.createElement('canvas');c.width=c.height=SIZE;
   const g=c.getContext('2d'),z=1/crop.s,w=SIZE*z;
   g.fillStyle='#000';g.fillRect(0,0,SIZE,SIZE);
   g.imageSmoothingQuality='high';
   g.drawImage(img,SIZE/2-crop.x*w,SIZE/2-crop.y*w,w,w);
   const blob=await encode(c);
   r.images=(await api(`image/${k}/${kind}`,{method:'PUT',headers:{'content-type':'image/jpeg'},body:blob})).images;
   done.push(`cropped · saved ${kb(blob.size)}`);
  }
  const h=Math.abs(crop.h-HOLE)<.001?null:+crop.h.toFixed(3);
  if(h!==r.hole){
   r.hole=(await api(`hole/${k}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({hole:h})})).hole;
   done.push(h?`inner circle ${(h*100).toFixed(1)}%`:'inner circle reset');
  }
  render();
  cur=document.querySelector(`.slot[data-k="${k}"][data-kind="${kind}"]`);
  note(cur,done.length?done.join(' · ').replace(/^./,c=>c.toUpperCase()):'Nothing to save','ok');
  img.src=cur.querySelector('img.art').src;crop=saved();drawCrop();
 }catch(err){note(cur,err.message,'err');alert('Could not save the crop: '+err.message)}
 finally{btn.disabled=false;btn.textContent='Save crop'}
});

// trays keep their uncropped upload, so the preview shows all of it with the box that gets saved, locked to
// the tray's shape so it matches what the player shows. Drag inside the box to move it, or a corner to resize it
// around the opposite corner. q is the box's edges as fractions of the source's width (l, r) and height (t, b).
let src=null,q={l:0,t:0,r:1,b:1};
// a saved crop of another shape (from before the lock) starts over at the default
const start=()=>{
 const c=src.crop,w=img.naturalWidth,h=img.naturalHeight;
 return c&&Math.abs((c.r-c.l)*w/((c.b-c.t)*h)/TRAY_AR-1)<.01?{...c}:trayBox(w,h);
};
const sq=$('view').querySelector('.sq'),img=$('view').querySelector('img');
const MIN=.05;
function drawSq(){
 sq.style.left=q.l*100+'%';sq.style.top=q.t*100+'%';
 sq.style.width=(q.r-q.l)*100+'%';sq.style.height=(q.b-q.t)*100+'%';
}
sq.addEventListener('pointerdown',e=>{
 e.preventDefault(); // else the browser may start a native drag or selection and cancel the pointer
 sq.setPointerCapture(e.pointerId);
 const fw=frame.clientWidth,fh=frame.clientHeight,x0=e.clientX,y0=e.clientY,o={...q},edge=e.target.dataset.e||'';
 sq.onpointermove=m=>{
  const dx=(m.clientX-x0)/fw,dy=(m.clientY-y0)/fh;
  if(!edge){
   const mx=clamp(dx,-o.l,1-o.r),my=clamp(dy,-o.t,1-o.b);
   q={l:o.l+mx,r:o.r+mx,t:o.t+my,b:o.b+my};
  }else{
   // in source pixels: grow from the anchored corner by whichever axis moved further, within the image
   const W=img.naturalWidth,H=img.naturalHeight,sx=edge.includes('e')?1:-1,sy=edge.includes('s')?1:-1;
   const ax=(sx>0?o.l:o.r)*W,ay=(sy>0?o.t:o.b)*H,px=(sx>0?o.r:o.l)*W+dx*W,py=(sy>0?o.b:o.t)*H+dy*H;
   const max=Math.min(sx>0?W-ax:ax,(sy>0?H-ay:ay)*TRAY_AR);
   const bw=clamp(Math.max(sx*(px-ax),sy*(py-ay)*TRAY_AR),Math.min(max,MIN*Math.min(W,H*TRAY_AR)),max),bh=bw/TRAY_AR;
   q={l:(sx>0?ax:ax-bw)/W,r:(sx>0?ax+bw:ax)/W,t:(sy>0?ay:ay-bh)/H,b:(sy>0?ay+bh:ay)/H};
  }
  drawSq();
 };
 sq.onpointerup=sq.onpointercancel=()=>sq.onpointermove=null;
});
$('sqReset').addEventListener('click',()=>{q=start();drawSq()});
$('sqSave').addEventListener('click',async e=>{
 const btn=e.target,{k,kind}=cur.dataset,r=rec();
 btn.disabled=true;btn.textContent='Saving…';
 try{
  const w=img.naturalWidth,h=img.naturalHeight,bw=(q.r-q.l)*w,bh=(q.b-q.t)*h,[W,H]=traySize(bw,bh);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');g.imageSmoothingQuality='high';
  g.drawImage(img,q.l*w,q.t*h,bw,bh,0,0,W,H);
  const blob=await encode(c);
  const crop=[q.l,q.t,q.r,q.b].map(v=>v.toFixed(4)).join(',');
  ({images:r.images,sources:r.sources}=await api(`image/${k}/${kind}?crop=${crop}`,{method:'PUT',headers:{'content-type':'image/jpeg'},body:blob}));
  src=r.sources[kind];q=start();render();
  cur=document.querySelector(`.slot[data-k="${k}"][data-kind="${kind}"]`);
  note(cur,`Cropped to ${W}×${H}${W>bw+1?` (upscaled from ${Math.round(bw)}×${Math.round(bh)})`:''} · saved ${kb(blob.size)}`,'ok');
 }catch(err){note(cur,err.message,'err');alert('Could not save the crop: '+err.message)}
 finally{btn.disabled=false;btn.textContent='Save crop'}
});

const list=$('list');
list.addEventListener('click',e=>{
 const slot=e.target.closest('.slot');if(!slot)return;
 if(e.target.closest('[data-del]'))return remove(slot);
 if(e.target.closest('[data-pick]'))return choose(slot);
 const box=e.target.closest('.box');
 if(box)box.classList.contains('has')?view(slot):choose(slot);
});
list.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('box')){e.preventDefault();e.target.click()}
});
$('file').addEventListener('change',e=>{if(pick&&e.target.files[0])upload(pick,e.target.files[0])});
// a drop only lands after hovering the same box for HOLD ms, so a file dragged across the list
// doesn't replace an image by accident; the bar along the bottom fills while it arms
// dragleave fires spuriously (often with no relatedTarget), so instead dragover, which repeats while the
// pointer is still, keeps the hold alive: it resets only when dragover lands elsewhere or stops arriving
const HOLD=1500;let hold=null;
const unhold=()=>{if(!hold)return;clearTimeout(hold.t);clearTimeout(hold.lost);hold.b.classList.remove('over','armed');hold=null};
addEventListener('dragover',e=>{
 const b=e.target.closest?.('.box');
 if(hold?.b!==b){
  unhold();if(!b)return;b.classList.add('over');
  hold={b,t:setTimeout(()=>b.classList.add('armed'),HOLD)};
 }
 clearTimeout(hold.lost);hold.lost=setTimeout(unhold,1000);
},true);
list.addEventListener('drop',e=>{
 const b=e.target.closest('.box');if(!b)return;e.preventDefault();
 const ok=b.classList.contains('armed');unhold();
 if(ok)upload(b.closest('.slot'),e.dataTransfer.files[0]);
 else note(b.closest('.slot'),'Hold over the box until the bar fills to drop');
});
addEventListener('dragend',unhold);
// stop a missed drop from navigating away to the image
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());

$('q').addEventListener('input',render);
$('missing').addEventListener('change',render);
$('guides').addEventListener('change',e=>document.body.classList.toggle('guides',e.target.checked));

api('records').then(r=>{RECS=r;render()}).catch(e=>{$('list').textContent='Could not load records: '+e.message});
</script>
